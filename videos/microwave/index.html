  for(const[k,h]of[[0,HA],[1,HB]]){const hp=h.clone().applyQuaternion(_q).add(_p);_m.compose(hp,_q,_s);HM.setMatrixAt(i*2+k,_m)}});

function heatColor(v){const s=[[0,[70,110,255]],[.45,[120,220,255]],[.7,[255,210,60]],[1,[255,70,60]]];for(let i=1;i<s.length;i++)if(v<=s[i][0]){const k=(v-s[i-1][0])/(s[i][0]-s[i-1][0]);return s[i-1][1].map((c,j)=>c+(s[i][1][j]-c)*k)}return s[3][1]}
let heatLast=-1;function updHeat(t){const A=P(t,CH[4]+.4,K.depth),dl=lerp(.13,.6,eio(P(t,K.core-.3,K.core+2.2)));const key=Math.round(A*100)+'_'+Math.round(dl*200);if(key===heatLast)return;heatLast=key;
 const g=heatTex.userData.c.getContext('2d'),im=g.createImageData(120,56);for(let j=0;j<56;j++)for(let i=0;i<120;i++){const x=(i/119-.5)*3,y=(j/55-.5)*1.4;const d=Math.min(1.5-Math.abs(x),.7-Math.abs(y));const v=A*Math.exp(-d/dl)*(dl<.2?1:lerp(1,.8,(dl-.13)/.47));const c=heatColor(clamp(v));const k=(j*120+i)*4;im.data[k]=c[0];im.data[k+1]=c[1];im.data[k+2]=c[2];im.data[k+3]=255}
 g.putImageData(im,0,0);heatTex.needsUpdate=true}

 const lp=V(x,yy+.07*Math.sin(x*9-t*10),.06).applyEuler(SL.rotation);dot(lp.x+SLW.position.x,lp.y+SLW.position.y,lp.z+SLW.position.z,str*fade)}}}

 const x=cs.x;XR.forEach(m=>{m.opacity=x;m.depthWrite=x>.97});edgeMat.opacity=(1-x)*.55;
